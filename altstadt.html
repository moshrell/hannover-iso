<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Altstadt Hannover · Stilprobe</title>
<style>
  :root {
    --bg:#0A0E0C; --txt:#EDE8DD; --mut:rgba(237,232,221,.58);
    --glow:#FFE7A3; --glow-hi:#FFF6D8; --glow-d:#C9A96E;
    --st-f:#1C1A16; --st-s:#141310; --st-t:#22201B; --st-l:#3E3A30;
    --tl-f:#2B1814; --tl-s:#21120F; --tl-l:#4A2A22;
    --cu-f:#13221F; --cu-s:#0E1917; --cu-l:#2B4842;
    --win:#0C0E0E; --win-l:#2E2C26;
    --st-f-on:#7C6842; --st-s-on:#514329; --st-t-on:#635436; --st-l-on:#C9AE72;
    --tl-f-on:#6A2C1F; --tl-s-on:#4E2118; --tl-l-on:#93503A;
    --cu-f-on:#2E5A50; --cu-s-on:#21443D; --cu-l-on:#5E9C8C;
    --bk-f:#26150F; --bk-s:#1C0F0B; --bk-t:#2C1912; --bk-l:#46281E;
    --bk-f-on:#8E4A30; --bk-s-on:#5F3020; --bk-t-on:#6E3926; --bk-l-on:#C8805C;
    --sl-f:#15191B; --sl-s:#0F1214; --sl-l:#2C3236;
    --sl-f-on:#3A454B; --sl-s-on:#283035; --sl-l-on:#6E7E86;
    --ease:cubic-bezier(.2,.7,.2,1); --soft:cubic-bezier(.45,0,.25,1);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--txt); }
  body { font-family:ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 16px 40px; }
  /* Desktop: Text + Knopf links, Zeichnung rechts, alles in einer Bildschirmhöhe */
  @media (min-width:900px) {
    .wrap { display:grid; grid-template-columns:minmax(240px, 300px) 1fr; grid-template-rows:auto 1fr; column-gap:40px; align-items:start;
            min-height:100svh; padding:clamp(24px, 5vh, 56px) 32px; }
    .intro { grid-column:1; grid-row:1; }
    .stage { grid-column:2; grid-row:1 / span 2; align-self:center; justify-self:center; }
    .side-col { grid-column:1; grid-row:2; }
  }
  .eb { font:500 .7rem/1.6 ui-monospace, "Cascadia Mono", Menlo, monospace; letter-spacing:.2em; text-transform:uppercase; color:var(--glow-d); }
  h1 { font:400 clamp(1.8rem, 5vw, 3rem)/1.05 "Palatino Linotype", Palatino, Georgia, serif; margin:.4rem 0 .3rem; }
  .sub { color:var(--mut); margin:0 0 1rem; font-size:.95rem; }
  /* Größe steht vor dem Zeichnen fest (--ar wird vor dem ersten Bild gesetzt) → nichts springt */
  .stage { --ar:1.39; position:relative; width:100%; aspect-ratio:var(--ar); }
  @media (min-width:900px) { .stage { width:min(100%, 880px, calc((100svh - 2 * clamp(24px, 5vh, 56px)) * var(--ar))); } }
  .stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none; transition:opacity .45s var(--ease), transform .45s var(--ease); }
  /* Ränder weich ausblenden: Teich und Gelände enden nicht an einer harten Kante */
  .stage svg { -webkit-mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent), linear-gradient(180deg, transparent, #000 6%, #000 88%, transparent);
               -webkit-mask-composite:source-in; mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent), linear-gradient(180deg, transparent, #000 6%, #000 88%, transparent); mask-composite:intersect; }
  .stage svg.out { opacity:0; transform:scale(.97); }
  .ctrl { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; align-items:center; }
  .btn { appearance:none; border:1px solid rgba(255,231,163,.35); background:rgba(255,231,163,.06); color:var(--txt);
         font:500 .95rem/1 inherit; padding:.85rem 1.1rem; border-radius:999px; cursor:pointer; display:inline-flex; gap:.6rem; align-items:center; min-height:46px;
         transition:background .3s, border-color .3s, box-shadow .3s; }
  .btn:hover { background:rgba(255,231,163,.12); }
  .btn:focus-visible { outline:2px solid var(--glow); outline-offset:3px; }
  .btn[aria-pressed="true"] { background:rgba(255,231,163,.18); border-color:var(--glow); box-shadow:0 0 22px rgba(255,231,163,.25); }
  .btn i { width:9px; height:9px; border-radius:50%; background:var(--glow); box-shadow:0 0 10px var(--glow); flex:none; }
  .btn.ic { width:46px; padding:0; justify-content:center; font-size:1.25rem; }
  .side { font:500 .78rem/1.5 ui-monospace, Menlo, monospace; letter-spacing:.08em; color:var(--glow-d); min-width:12ch; text-align:center; }
  .read { flex:1 1 100%; font:500 .78rem/1.5 ui-monospace, Menlo, monospace; color:var(--mut); letter-spacing:.06em; }

  .credit { margin-top:2rem; font:.72rem/1.5 ui-monospace, Menlo, monospace; color:rgba(237,232,221,.35); }

  /* ---------- Zeichnung ---------- */
  .rh * { vector-effect:non-scaling-stroke; }
  /* Abendablauf: Laternen → Fenster etagenweise → Anstrahlung der Fassade von unten nach oben → Kuppellaterne.
     Jedes Element bekommt seine Verzögerung als --d (JS), Abschalten läuft rückwärts. */
  .rh .st, .rh .tl, .rh .cu, .rh .bk, .rh .sl, .rh .gz, .rh .lv, .rh .dt, .rh .mul, .rh .clockface, .rh .hand { transition:fill 1.84s var(--soft) var(--d, 0s), stroke 1.84s var(--soft) var(--d, 0s); }
  .rh .wn { transition:fill 1.22s var(--soft) var(--d, 0s), stroke 1.22s var(--soft) var(--d, 0s), opacity 1.22s var(--soft) var(--d, 0s); }
  .rh .lamp, .rh .lant { transition:fill 1.38s var(--soft) var(--d, 0s); }
  .rh .lamp-g, .rh .lamp-r, .rh .lant-h { transition:opacity 1.53s var(--soft) var(--d, 0s); }
  .rh .flood { transition:opacity 2.75s var(--soft) var(--d, 0s); }
  .rh .wins { filter:url(#wglow); }
  .rh.instant * { transition:none !important; }
  @media (prefers-reduced-motion:reduce) { .rh * { transition-duration:.01s !important; transition-delay:0s !important; } }
  .rh .st { stroke:var(--st-l); stroke-width:.8; stroke-linejoin:round; }
  .rh .st.fr { fill:var(--st-f); } .rh .st.sd { fill:var(--st-s); } .rh .st.tp { fill:var(--st-t); }
  .rh .tl { stroke:var(--tl-l); stroke-width:.8; stroke-linejoin:round; fill:var(--tl-f); } .rh .tl.sd { fill:var(--tl-s); }
  .rh .cu { stroke:var(--cu-l); stroke-width:.8; stroke-linejoin:round; fill:var(--cu-f); } .rh .cu.sd { fill:var(--cu-s); }
  .rh .dt { fill:none; stroke:var(--st-l); stroke-width:.55; }
  .rh .bk { stroke:var(--bk-l); stroke-width:.8; stroke-linejoin:round; fill:var(--bk-f); } .rh .bk.sd { fill:var(--bk-s); } .rh .bk.tp { fill:var(--bk-t); }
  .rh .sl { stroke:var(--sl-l); stroke-width:.8; stroke-linejoin:round; fill:var(--sl-f); } .rh .sl.sd { fill:var(--sl-s); }
  .rh .on-bk .dt { stroke:var(--bk-l); } .rh .dt.sl-d { stroke:var(--sl-l); }
  .rh .gz { fill:none; stroke:#20302A; stroke-width:.5; }
  .rh .lv { fill:#080A0A; stroke:var(--bk-l); stroke-width:.5; }
  .rh .road { fill:#0C0F0D; stroke:#191E1B; stroke-width:.6; }
  .rh .rail { fill:none; stroke:#2E2C26; stroke-width:.6; }
  .rh .water { fill:#081211; } .rh .rip { stroke:#1C2B29; transition:stroke 2s var(--soft) var(--d, 0s); } .rh.lamps .rip { stroke:#3A4E48; }
  .rh .lamp-r { fill:none; stroke:var(--glow); stroke-width:1.4; opacity:0; }
  .rh .dt.tl-d { stroke:var(--tl-l); } .rh .dt.cu-d { stroke:var(--cu-l); }
  .rh .wn { fill:var(--win); stroke:var(--win-l); stroke-width:.5; }
  .rh .mul { fill:none; stroke:var(--win-l); stroke-width:.45; }
  .rh .court { fill:#070908; stroke:var(--st-l); stroke-width:.6; }

  .rh .rip { fill:none; stroke-width:.8; }
  .rh .pave { fill:#111512; stroke:#1E2420; stroke-width:.6; }
  .rh .pave-d { fill:none; stroke:#232A25; stroke-width:.6; }
  .rh .bush { fill:#0E1612; stroke:#22322A; stroke-width:.7; }
  .rh .bush-d { fill:none; stroke:#1B2A22; stroke-width:.6; }
  .rh .tree { fill:#0B110E; stroke:#1C2A22; stroke-width:.7; }
  .rh .trunk { fill:none; stroke:#2A2A24; stroke-width:1; }
  .rh .pole { fill:none; stroke:#3A372E; stroke-width:.9; }
  .rh .lamp { fill:#2A2720; stroke:#4A4436; stroke-width:.5; }
  .rh .lamp-g { fill:var(--glow); opacity:0; }
  .rh .star { fill:var(--glow-hi); }
  .rh .clockface { fill:var(--win); stroke:var(--st-l); stroke-width:.7; }
  .rh .hand { stroke:var(--st-l); stroke-width:1.1; stroke-linecap:round; }
  .rh .lant { fill:var(--win); stroke:var(--cu-l); stroke-width:.7; }
  .rh .lant-h { fill:var(--glow); opacity:0; }
  .rh .flood { opacity:0; }
  .rh .refl { opacity:.55; }

  .rh.lit .st { stroke:var(--st-l-on); }
  .rh.lit .st.fr { fill:var(--st-f-on); } .rh.lit .st.sd { fill:var(--st-s-on); } .rh.lit .st.tp { fill:var(--st-t-on); }
  .rh.lit .tl { stroke:var(--tl-l-on); fill:var(--tl-f-on); } .rh.lit .tl.sd { fill:var(--tl-s-on); }
  .rh.lit .cu { stroke:var(--cu-l-on); fill:var(--cu-f-on); } .rh.lit .cu.sd { fill:var(--cu-s-on); }
  .rh.lit .dt { stroke:var(--st-l-on); }
  .rh.lit .bk { stroke:var(--bk-l-on); fill:var(--bk-f-on); } .rh.lit .bk.sd { fill:var(--bk-s-on); } .rh.lit .bk.tp { fill:var(--bk-t-on); }
  .rh.lit .sl { stroke:var(--sl-l-on); fill:var(--sl-f-on); } .rh.lit .sl.sd { fill:var(--sl-s-on); }
  .rh.lit .on-bk .dt { stroke:var(--bk-l-on); } .rh.lit .dt.sl-d { stroke:var(--sl-l-on); }
  .rh.lit .gz { stroke:#6C9C80; } .rh.lit .lv { stroke:var(--bk-l-on); }
  .rh.lamps .lamp-r { opacity:.32; } .rh.lit .dt.tl-d { stroke:var(--tl-l-on); } .rh.lit .dt.cu-d { stroke:var(--cu-l-on); }
  .rh.win .wn { fill:var(--glow); stroke:var(--glow-hi); }
  .rh.win .wn.hi { fill:var(--glow-hi); }
  .rh.win .wn.dim { fill:#E8C77E; opacity:.75; }
  .rh.lit .mul { stroke:#7A6338; }
  .rh.lit .flood { opacity:1; }
  .rh.lit .clockface { fill:var(--glow-hi); stroke:var(--glow); }
  .rh.lit .hand { stroke:#3A2E18; }
  .rh.crown .lant { fill:var(--glow-hi); }
  .rh.crown .lant-h { opacity:.65; }
  .rh.lamps .lamp { fill:var(--glow-hi); }
  .rh.lamps .lamp-g { opacity:.55; }
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
  <span class="eb">Stilprobe · Hannover-Karte</span>
  <h1>Altstadt</h1>
  <p class="sub">Marktkirche (14. Jh., Turm 97 m), Altes Rathaus mit Schaugiebel und das Leineschloss – heute Niedersächsischer Landtag.</p>
  </div>
  <div class="stage" id="stage"></div>
  <div class="side-col">
  <div class="ctrl">
    <button class="btn" id="b-light" aria-pressed="false"><i></i>Abendlicht</button>
    <span class="read" id="read" aria-live="polite"></span>
  </div>
  <p class="credit">Projektion nach iso-figure (MIT, Tolga Cohce) · Zeichnung nicht maßstabsgetreu, Abstände verkürzt</p>
  </div>
</div>
<script>
(() => {
  'use strict';
  const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
  const f2 = n => (+n).toFixed(2);
  const CX = 30, CY = 50;                  // Szenenmitte
  const Z0 = 1, ZW = 0;                    // Gelände, Wasser der Leine
  const SIDES = ['Altstadt · Blick von Südosten'];

  /* ---------- Drehung um 90°-Schritte ---------- */
  const rot = (k, x, y) => { const dx = x - CX, dy = y - CY; return k === 0 ? [dx, dy] : k === 1 ? [-dy, dx] : k === 2 ? [-dx, -dy] : [dy, -dx]; };
  const rotV = (k, x, y) => k === 0 ? [x, y] : k === 1 ? [-y, x] : k === 2 ? [-x, -y] : [y, -x];

  /* ---------- Kernel: Projektion (iso-figure, MIT), Drehung, Spiegelung am Wasser ---------- */
  function kernel(k, ox, oy, mirror) {
    const Z = z => mirror ? 2 * ZW - z : z;
    const P = (x, y, z) => { const [a, b] = rot(k, x, y); return [(a - b) * C + ox, (a + b) * S - Z(z) + oy]; };
    const D = (x, y, z) => { const [a, b] = rotV(k, x, y); return [(a - b) * C, (a + b) * S - (mirror ? -z : z)]; };
    const plane = (O, U, V) => { const o = P(...O), u = D(...U), v = D(...V); return `matrix(${f2(u[0])} ${f2(u[1])} ${f2(v[0])} ${f2(v[1])} ${f2(o[0])} ${f2(o[1])})`; };
    const TOP = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 1, 0]);
    const path = pts => 'M' + pts.map(p => P(...p).map(f2).join(' ')).join('L');
    const poly = (pts, cls) => `<path class="${cls}" d="${path(pts)}Z"/>`;
    const g = (t, inner) => `<g transform="${t}">${inner}</g>`;
    // Blickrichtung im gedrehten Raum: (1,1,1)
    const facing = (nx, ny, nz = 0) => { const [a, b] = rotV(k, nx, ny); return a + b + nz; };
    const shade = (nx, ny) => { const [a, b] = rotV(k, nx, ny); return b >= a ? 'fr' : 'sd'; };
    // Wand von L nach R (von außen gesehen links → rechts), Unterkante z0, Oberkante z1
    function wall(L, R, z0, z1, mat, deco) {
      const dx = R[0] - L[0], dy = R[1] - L[1], len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
      if (facing(nx, ny) <= 1e-6) return '';
      const t = plane([L[0], L[1], z1], [dx / len, dy / len, 0], [0, 0, -1]);
      return `<g transform="${t}"><rect class="${mat} ${shade(nx, ny)}" width="${f2(len)}" height="${f2(z1 - z0)}"/>${deco ? deco(len, z1 - z0) : ''}</g>`;
    }
    const wallVisible = (L, R) => { const dx = R[0] - L[0], dy = R[1] - L[1]; return facing(-dy, dx) > 1e-6; };
    // Quader; deco = {S, N, E, W}: (Länge, Höhe) → SVG in Flächenkoordinaten
    function box(x, y, z, w, d, h, mat, deco = {}, top = true) {
      return wall([x + w, y], [x, y], z, z + h, mat, deco.N) + wall([x, y], [x, y + d], z, z + h, mat, deco.W)
        + wall([x, y + d], [x + w, y + d], z, z + h, mat, deco.S) + wall([x + w, y + d], [x + w, y], z, z + h, mat, deco.E)
        + (top ? `<rect class="${mat} tp" transform="${TOP(x, y, z + h)}" width="${f2(w)}" height="${f2(d)}"/>` : '');
    }
    // ebene Fläche mit Rückseitenprüfung; n wird aus dem Polygon berechnet und nach oben orientiert
    function face(pts, mat, extra = '') {
      let nx = 0, ny = 0, nz = 0;
      for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; nx += (a[1] - b[1]) * (a[2] + b[2]); ny += (a[2] - b[2]) * (a[0] + b[0]); nz += (a[0] - b[0]) * (a[1] + b[1]); }
      if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
      if (facing(nx, ny, nz) <= 1e-6) return '';
      const [a, b] = rotV(k, nx, ny);
      return `<path class="${mat} ${b >= a ? 'fr' : 'sd'}" d="${path(pts)}Z"/>${extra}`;
    }
    return { k, P, D, plane, TOP, path, poly, g, wall, wallVisible, box, face, facing, mirror };
  }

  /* ---------- Hilfen ---------- */
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const vari = () => { const r = rnd(); return r < .14 ? ' dim' : r < .32 ? ' hi' : ''; };
  const arch = (x, y, w, h) => `M${f2(x)} ${f2(y + h)}V${f2(y + w / 2)}A${f2(w / 2)} ${f2(w / 2)} 0 0 1 ${f2(x + w)} ${f2(y + w / 2)}V${f2(y + h)}Z`;
  const hl = (x0, x1, y) => `<path class="dt" d="M${f2(x0)} ${f2(y)}H${f2(x1)}"/>`;
  const vl = (x, y0, y1) => `<path class="dt" d="M${f2(x)} ${f2(y0)}V${f2(y1)}"/>`;
  // Rechteckfenster mit Fensterkreuz
  const winR = (x, y, w, h, f) => `<rect class="wn${vari()}" data-f="${f}" x="${f2(x)}" y="${f2(y)}" width="${f2(w)}" height="${f2(h)}"/><path class="mul" d="M${f2(x + w / 2)} ${f2(y)}V${f2(y + h)}M${f2(x)} ${f2(y + h * .38)}H${f2(x + w)}"/>`;
  // Bogenfenster mit Sprosse und Schlussstein
  const winA = (x, y, w, h, f, cls = '') => `<path class="wn${cls || vari()}" data-f="${f}" d="${arch(x, y, w, h)}"/><path class="mul" d="M${f2(x + w / 2)} ${f2(y + w * .1)}V${f2(y + h)}M${f2(x)} ${f2(y + w / 2 + (h - w / 2) * .35)}H${f2(x + w)}"/><path class="dt" d="M${f2(x + w / 2 - .35)} ${f2(y - .45)}h.7l-.15 .7h-.4Z"/>`;
  const wins = s => `<g class="wins">${s}</g>`;

  // Volutengiebel in Wandkoordinaten: Grundlinie bei v = 0, nach oben negativ
  function gableD(w, h) {
    const segs = [['L', [0, -.30]], ['C', [0, -.38], [.13, -.34], [.13, -.44]], ['L', [.13, -.58]], ['C', [.13, -.66], [.27, -.62], [.27, -.72]],
      ['L', [.27, -.82]], ['C', [.27, -.88], [.4, -.86], [.4, -.92]], ['L', [.5, -1]]];
    const pt = ([a, b]) => `${f2(a * w)} ${f2(b * h)}`, mir = ([a, b]) => [1 - a, b];
    let d = 'M0 0';
    segs.forEach(s => { d += s[0] === 'L' ? `L${pt(s[1])}` : `C${pt(s[1])} ${pt(s[2])} ${pt(s[3])}`; });
    const pts = [[0, 0], ...segs.map(s => s[s.length - 1])];
    for (let i = segs.length - 1; i >= 0; i--) { const s = segs[i], from = pts[i]; d += s[0] === 'L' ? `L${pt(mir(from))}` : `C${pt(mir(s[2]))} ${pt(mir(s[1]))} ${pt(mir(from))}`; }
    return d + 'Z';
  }
  function gable(w, h, inner = '', shade = 'fr') {
    const fin = (a, b) => `${vl(a * w, b * h, b * h - 2)}<circle class="st ${shade}" cx="${f2(a * w)}" cy="${f2(b * h - 2.4)}" r=".5"/>`;
    return `<path class="st ${shade}" d="${gableD(w, h)}"/>${hl(.04 * w, .96 * w, -.30 * h)}${hl(.13 * w, .87 * w, -.58 * h)}${hl(.27 * w, .73 * w, -.82 * h)}`
      + `${vl(.27 * w, -.30 * h, -.58 * h)}${vl(.73 * w, -.30 * h, -.58 * h)}`
      + fin(.13, -.44) + fin(.87, -.44) + fin(.27, -.72) + fin(.73, -.72) + fin(.5, -1) + inner;
  }

  // runde Körper aus projizierten Ringen (konvexe Hülle)
  function hull(pts) {
    pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of pts.slice().reverse()) { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  function lathe(K, cx, cy, prof, cls, ribs = 0, rings = []) {
    const pts = [];
    prof.forEach(([z, r]) => { for (let i = 0; i < 36; i++) { const t = i / 36 * 2 * Math.PI; pts.push(K.P(cx + r * Math.cos(t), cy + r * Math.sin(t), z)); } });
    let s = `<path class="${cls}" d="M${hull(pts).map(p => p.map(f2).join(' ')).join('L')}Z"/>`;
    const dc = cls.startsWith('cu') ? 'dt cu-d' : 'dt';
    // sichtbare Hälfte: Richtungen mit positiver Blickkomponente
    const vis = a => K.facing(Math.cos(a), Math.sin(a)) > 0;
    for (let i = 0; i < ribs * 2; i++) {
      const a = Math.PI * 2 * (i + .5) / (ribs * 2);
      if (!vis(a)) continue;
      s += `<path class="${dc}" d="${K.path(prof.map(([z, r]) => [cx + r * Math.cos(a), cy + r * Math.sin(a), z]))}"/>`;
    }

  // Walmdach über Rechteck, First entlang der langen Seite; Ziegellinien
  function hip(K, x0, y0, x1, y1, ze, zr, mat = 'tl') {

  // Spitzbogen (gotisch) in Wandkoordinaten

  // Treppengiebel: 2n+1 Pfeiler, Mitte am höchsten, Fiale auf jedem Pfeiler, Blendnischen

      if (y > 57 && y < 83) continue;
      s += K.box(x1 - 1.5, y - .8, z0 + .5, 1.2, 1.6, 2.4, 'st', { E: () => wins(winA(.3, .4, 1, 1.6, 3)) }, false);
      s += saddle(K, [x1 - .3, y + 1], [x1 - .3, y - 1], [-1.6, 0], z0 + 2.9, z0 + 3.8, 'sl');
    }
    for (let x = -16.4; x < 5; x += 3.6) {
      s += K.box(x - .8, y1 - 1.5, z0 + .5, 1.6, 1.2, 2.4, 'st', { S: () => wins(winA(.3, .4, 1, 1.6, 3)) }, false);
      s += saddle(K, [x - 1, y1 - .3], [x + 1, y1 - .3], [0, -1.6], z0 + 2.9, z0 + 3.8, 'sl');
    }
    return s;
  } });
  add({ id: 'lsPortico', b: 'ls', o: .2, fp: [6, 58, 20, 82], parent: 'ls', side: 'E', draw: K => {
    let s = K.box(6, 58, Z0, 8, 24, 2.2, 'st', { E: l => hl(0, l, .4) });
    for (let i = 0; i < 5; i++) s += K.box(14 + i * 1.1, 60, Z0, 1.1, 20, Math.max(.05, 2.2 * (5 - i) / 6), 'st');
    // sechs korinthische Säulen
    for (let i = 0; i < 6; i++) { const y = 59.6 + i * 4.16;
      s += lathe(K, 12.4, y, [[Z0 + 2.2, 1.05], [Z0 + 2.9, .82], [16, .72], [16.6, .95], [17.2, 1.15]], 'st fr', 3, [1, 3]); }
    s += K.box(6, 58, 17.2, 8.6, 24, 1.9, 'st', { E: l => hl(0, l, .5) + hl(0, l, 1.1) + Array.from({ length: 24 }, (_, i) => vl(.5 + i, 1.1, 1.9)).join(''), S: l => hl(0, l, .5) });
    s += saddle(K, [14.6, 82], [14.6, 58], [-8.6, 0], 19.1, 24.4, 'sl');
    s += K.wall([14.6, 82], [14.6, 58], 19.1, 19.11, 'st', len => `<path class="st sd" d="M0 0L${f2(len / 2)} -5.3L${f2(len)} 0Z"/><path class="dt" d="M1.4 -.5L${f2(len / 2)} -4.6L${f2(len - 1.4)} -.5Z"/><circle class="dt" cx="${f2(len / 2)}" cy="-2.1" r="1.1"/><path class="dt" d="M${f2(len / 2 - 4)} -.9q1.6 -1.6 2.8 -1.2M${f2(len / 2 + 4)} -.9q-1.6 -1.6 -2.8 -1.2"/>`);
    return s;
  } });
  // Plenarsaal (Glasbau, 1962 / 2017)
  add({ id: 'lsPlenum', b: 'ls', o: .1, fp: [-18, 102, 4, 116], draw: K => {
    const glass = (len, h) => { let q = '', w = ''; const n = Math.floor(len / 2.2);
      for (let i = 0; i < n; i++) { const u = (len - n * 2.2) / 2 + i * 2.2; [[.8, 3.2, 2], [4.4, 3.2, 1], [8, h - 8.6, 0]].forEach(([v, hh, f]) => { w += `<rect class="wn${vari()}" data-f="${f}" x="${f2(u + .15)}" y="${f2(v)}" width="1.9" height="${f2(hh)}"/>`; }); }
      return q + wins(w) + hl(0, len, 4.1) + hl(0, len, 7.7); };
    return K.box(-18, 102, Z0, 22, 14, 12, 'st', { E: glass, S: glass }, true) + K.box(-18.8, 101.2, Z0 + 12, 23.6, 15.6, .8, 'sl');
  } });

  // Laternen, Bäume
  const lamp = (x, y) => add({ id: `l${x}_${y}`, fp: [x - .5, y - .5, x + .5, y + .5], obj: true, draw: K => {
    const a = K.P(x, y, Z0), b = K.P(x, y, Z0 + 5.6), c = K.P(x, y, Z0 + 6.2);
    return `<path class="pole" d="M${f2(a[0])} ${f2(a[1])}L${f2(b[0])} ${f2(b[1])}"/><circle class="lamp-g" cx="${f2(c[0])}" cy="${f2(c[1])}" r="3.4" filter="url(#bloom)"/><circle class="lamp" cx="${f2(c[0])}" cy="${f2(c[1])}" r=".85"/>`;
  } });
  [[44, 34], [70, 38], [102, 30], [56, 68], [78, 70], [100, 66], [18, 44], [18, 96], [-21, 4], [-21, 34], [-21, 64], [-21, 96], [10, 112], [30, 104]].forEach(([x, y]) => lamp(x, y));
  const tree = (x, y, r) => add({ id: `t${x}_${y}`, fp: [x - r * .7, y - r * .7, x + r * .7, y + r * .7], obj: true, draw: K => {
    const a = K.P(x, y, Z0), b = K.P(x, y, Z0 + r * 1.2); let t = `<path class="trunk" d="M${f2(a[0])} ${f2(a[1])}L${f2(b[0])} ${f2(b[1])}"/>`;
    [[0, 1.9, 1], [-.6, 1.4, .8], [.7, 1.5, .75], [0, 2.6, .7]].forEach(([dx, dz, s]) => { const c = K.P(x + dx * r, y - dx * r, Z0 + r * dz); t += `<circle class="tree" cx="${f2(c[0])}" cy="${f2(c[1])}" r="${f2(r * s)}"/>`; });
    return t;
  } });
  [[28, 50, 4.2], [28, 64, 4.4], [28, 88, 4.2], [40, 50, 4], [40, 64, 4.2], [40, 78, 4], [40, 92, 4.4], [-53, -14, 5], [-53, 22, 5.5], [-53, 58, 5], [-53, 94, 5.5], [-2, -14, 5]].forEach(a => tree(...a));

  /* ---------- Sortierung je Ansicht ---------- */
  function order(k) {
    const rf = m => { const a = rot(k, m.fp[0], m.fp[1]), b = rot(k, m.fp[2], m.fp[3]); return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])]; };
    const list = M.filter(m => !m.ground).map(m => ({ m, r: rf(m), c: 0 }));
    list.forEach(o => { o.c = (o.r[0] + o.r[2]) / 2 + (o.r[1] + o.r[3]) / 2; });
    const byId = Object.fromEntries(list.map(o => [o.m.id, o]));
    const edges = new Map(list.map(o => [o, new Set()])), indeg = new Map(list.map(o => [o, 0]));
    const edge = (a, b) => { if (a === b || edges.get(a).has(b)) return; edges.get(a).add(b); indeg.set(b, indeg.get(b) + 1); };
    const K0 = kernel(k, 0, 0, false);
    list.forEach(o => {
      const m = o.m;
      if (m.parent) { const p = byId[m.parent]; const n = N_[m.side]; K0.facing(n[0], n[1]) > 0 ? edge(p, o) : edge(o, p); }
      if (m.above) edge(byId[m.above], o);
    });
    const E = .01;
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const A = list[i], B = list[j];
      const related = (A.m.parent === B.m.id || B.m.parent === A.m.id || A.m.above === B.m.id || B.m.above === A.m.id);
      if (related) continue;
      const ab = A.r[2] <= B.r[0] + E || A.r[3] <= B.r[1] + E, ba = B.r[2] <= A.r[0] + E || B.r[3] <= A.r[1] + E;
      if (ab && !ba) edge(A, B); else if (ba && !ab) edge(B, A);
    }
    const out = [], ready = list.filter(o => indeg.get(o) === 0);
    while (ready.length) {
      ready.sort((a, b) => a.c - b.c);
      const o = ready.shift(); out.push(o.m);
      edges.get(o).forEach(n => { indeg.set(n, indeg.get(n) - 1); if (indeg.get(n) === 0) ready.push(n); });
    }
    if (out.length < list.length) list.filter(o => !out.includes(o.m)).sort((a, b) => a.c - b.c).forEach(o => out.push(o.m));
    return out;
  }

  /* ---------- Rahmen: eng um die Szene ---------- */
  const ext = [[-50, -30, 0], [-50, 96, 0], [-10, 124, 0], [106, 80, 0], [106, -10, 0], [20, -30, 0], [23, 13, 100]];
  let X0 = 1e9, X1 = -1e9, Y0 = 1e9, Y1 = -1e9;
  ext.forEach(([x, y, z]) => { const [a, b] = rot(0, x, y); const X = (a - b) * C, Y = (a + b) * S - z; X0 = Math.min(X0, X); X1 = Math.max(X1, X); Y0 = Math.min(Y0, Y); Y1 = Math.max(Y1, Y); });
  const pad = 6, W = X1 - X0 + 2 * pad, H = Y1 - Y0 + 2 * pad;
  const origin = () => [pad - X0, pad - Y0];

  /* ---------- Gelände: Leine links, Plätze, Straßen ---------- */
  const RV = { x0: -46, x1: -22, y0: -60, y1: 150 };
  function ground(K) {
    let s = `<path fill="url(#gfade)" d="${K.path([[-90, -70, Z0], [130, -70, Z0], [130, 150, Z0], [-90, 150, Z0]])}Z"/>`;
    // Marktplatz und Umgebung der Kirche
    s += `<path class="pave" d="${K.path([[8, -10, Z0], [106, -10, Z0], [106, 80, Z0], [48, 80, Z0], [48, 40, Z0], [8, 40, Z0]])}Z"/>`;
    s += K.g(K.TOP(48, 62, Z0), Array.from({ length: 12 }, (_, i) => `<path class="pave-d" d="M${f2(i * 4.8)} 0V16"/>`).join('') + `<path class="pave-d" d="M0 8H56"/>`);
    s += K.g(K.TOP(26, 28, Z0), [0, 1, 2, 3].map(i => `<path class="pave-d" d="M0 ${4 + i * 4}C20 ${i * 3} 50 ${16 - i * 2} 78 ${6 + i * 2}"/>`).join(''));
    // Hannah-Arendt-Platz vor dem Portikus
    s += `<path class="pave" d="${K.path([[20, 42, Z0], [46, 42, Z0], [46, 100, Z0], [20, 100, Z0]])}Z"/>`;
    s += K.g(K.TOP(20, 42, Z0), Array.from({ length: 7 }, (_, i) => `<path class="pave-d" d="M0 ${f2(4 + i * 8.4)}H26"/>`).join(''));
    // Leinstraße
    s += `<path class="road" d="${K.path([[8, 40, Z0], [20, 40, Z0], [20, 120, Z0], [8, 120, Z0]])}Z"/>`;
    // Ufer + Plenarsaal-Vorplatz
    s += `<path class="pave" d="${K.path([[-22, -40, Z0], [-20, -40, Z0], [-20, 130, Z0], [-22, 130, Z0]])}Z"/>`;
    s += `<path class="pave" d="${K.path([[-22, 100, Z0], [20, 100, Z0], [20, 124, Z0], [-22, 124, Z0]])}Z"/>`;
    return s;
  }
  function river(K) {
    const w = [[RV.x0, RV.y0, ZW], [RV.x1, RV.y0, ZW], [RV.x1, RV.y1, ZW], [RV.x0, RV.y1, ZW]];
    let s = `<clipPath id="rvclip"><path d="${K.path(w)}Z"/></clipPath><path class="water" d="${K.path(w)}Z"/><g clip-path="url(#rvclip)">`;
    for (let i = 0; i < 52; i++) { const y = RV.y0 + 4 + i * 4, xa = RV.x0 + 1 + (i * 37 % 11), xb = RV.x1 - 1 - (i * 53 % 9);
      s += `<path class="rip" stroke-dasharray="${f2(3 + i % 4 * 2)} ${f2(2 + i % 3 * 2)}" d="${K.path([[xa, y, ZW], [xb, y + 1.4, ZW]])}"/>`; }
    // Lichtspiegelungen der Uferlaternen
    [4, 34, 64, 96].forEach(y => { const a = K.P(-23, y, ZW), b = K.P(-23, y + 3, ZW);
      s += `<path class="lamp-r" filter="url(#bloom)" d="M${f2(a[0])} ${f2(a[1])}L${f2(b[0])} ${f2(b[1] + 9)}"/>`; });
    s += `</g>`;
    // Ufermauer West (Blick darauf), Geländer Ost
    s += K.wall([RV.x0, RV.y1], [RV.x0, RV.y0], ZW, Z0, 'st');
    s += `<path class="rail" d="${K.path([[RV.x1 + .4, RV.y0, Z0 + 1.2], [RV.x1 + .4, RV.y1, Z0 + 1.2]])}"/>`;
    return s;
  }

  /* ---------- Szene zeichnen ---------- */
  function render(k) {
    const [OX, OY] = origin(k), K = kernel(k, OX, OY, false);
    const mods = order(k);
    let out = `<defs>
      <filter id="wglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="bloom" filterUnits="userSpaceOnUse" x="-50" y="-50" width="${f2(W + 100)}" height="${f2(H + 100)}"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="rblur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation=".5 1.1"/></filter>
      <radialGradient id="gfade" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#161B18"/><stop offset=".45" stop-color="#101412"/><stop offset=".8" stop-color="#0A0E0C" stop-opacity="0"/></radialGradient>
      <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE7A3" stop-opacity=".16"/><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/></radialGradient>
      <linearGradient id="hallglow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A3" stop-opacity="0"/><stop offset=".5" stop-color="#FFE7A3" stop-opacity=".35"/><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/></linearGradient>
    </defs>`;
    seed = 3;
    for (let i = 0; i < 46; i++) { const x = rnd() * W, y = rnd() * H * .3; out += `<circle class="star" cx="${f2(x)}" cy="${f2(y)}" r="${f2(.15 + rnd() * .35)}" opacity="${f2(.15 + rnd() * .5)}"/>`; }
    out += ground(K) + river(K);
    const ac = K.P(40, 30, 30);
    out += `<g class="flood"><ellipse cx="${f2(ac[0])}" cy="${f2(ac[1])}" rx="${f2(W * .42)}" ry="${f2(H * .36)}" fill="url(#aura)"/></g>`;
    seed = 7;
    out += mods.map(m => `<g class="bld" data-b="${m.b || ''}" data-o="${m.o || 0}">${m.draw(K)}</g>`).join('');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 ${f2(W)} ${f2(H)}`);
    svg.setAttribute('class', 'rh');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `Isometrische Zeichnung der Altstadt Hannover mit Marktkirche, Altem Rathaus und Leineschloss, ${SIDES[k]}`);
    svg.innerHTML = out;
    return svg;
  }

  /* ---------- Bedienung ---------- */
  document.getElementById('stage').style.setProperty('--ar', (W / H).toFixed(4));
  const stage = document.getElementById('stage'), read = document.getElementById('read');
  const bLight = document.getElementById('b-light');
  const views = [];
  const st = { k: 0, lit: false };
  let cur = null, timers = [];
  const view = k => views[k] || (views[k] = render(k));
  function clock(svg) {
    const d = new Date(), m = d.getMinutes(), h = d.getHours() % 12 + m / 60;
    svg.querySelectorAll('.hand').forEach(el => { const a = (el.dataset.h === 'h' ? h / 12 : m / 60) * 2 * Math.PI, L = +el.dataset.l, cx = +el.dataset.cx, cy = +el.dataset.cy;
      el.setAttribute('x2', f2(cx + L * Math.sin(a))); el.setAttribute('y2', f2(cy - L * Math.cos(a))); });
  }
  // Ablauf: Zeiten in Sekunden; on = einschalten, sonst rückwärts ausschalten
  const T = { win0: 1.0, floor: .8, winJit: 1.0, flood0: 5.0, sweep: 3.0, crown: 9.2 };
  const OFF = { crown: 0, sweep: 2.6, flood0: .3, win0: 2.4, floor: .7, winJit: .9, lamp0: 6.4 };
  let prep = null;
  function prepare(svg) {
    const inClk = el => !!el.closest('.clk');
    const walls = [...svg.querySelectorAll('.st, .tl, .cu, .bk, .sl, .gz, .lv, .dt, .mul')].filter(el => !inClk(el));
    const span = new Map();
    walls.forEach(el => { const g = el.closest('.bld'), key = g ? g.dataset.b : '', q = el.getBoundingClientRect();
      const v = span.get(key) || { top: 1e9, base: -1e9 }; v.top = Math.min(v.top, q.top); v.base = Math.max(v.base, q.bottom); span.set(key, v); el._q = q; el._k = key; el._o = g ? +g.dataset.o : 0; });
    let sd = 11; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    return {
      walls: walls.map(el => { const v = span.get(el._k), h = (v.base - el._q.bottom) / Math.max(1, v.base - v.top); return [el, Math.min(1, Math.max(0, h)), el._o]; }),
      clocks: [...svg.querySelectorAll('.clk *')],
      wins: [...svg.querySelectorAll('.wn')].filter(el => !inClk(el)).map(el => [el, +el.dataset.f || 0, r()]),
      lamps: [...svg.querySelectorAll('.lamp, .lamp-g, .lamp-r')].map(el => [el, r()]),
      crown: [...svg.querySelectorAll('.lant, .lant-h')],
      flood: [...svg.querySelectorAll('.flood')],
    };
  }
  const SPEED = .765;  // Tempo des ganzen Ablaufs (1 = langsam, kleiner = schneller)
  const setD = (el, d) => el.style.setProperty('--d', `${(d * SPEED).toFixed(2)}s`);
  function applyLight(svg) {
    prep = prep || prepare(svg);
    const on = st.lit;
    const lampR = new Map();
    prep.lamps.forEach(([el, q]) => { const k = el.getAttribute('cx') || el.getAttribute('d').slice(0, 12); if (!lampR.has(k)) lampR.set(k, q); setD(el, on ? lampR.get(k) * 1.2 : OFF.lamp0 + lampR.get(k) * 1); });
    prep.wins.forEach(([el, f, q]) => setD(el, on ? T.win0 + f * T.floor + q * T.winJit : OFF.win0 + (4 - f) * OFF.floor + q * OFF.winJit));
    prep.walls.forEach(([el, h, o]) => setD(el, on ? T.flood0 + o + h * T.sweep : OFF.flood0 + (1 - o) * .4 + (1 - h) * OFF.sweep));
    prep.flood.forEach(el => setD(el, on ? T.flood0 + .4 : OFF.flood0));
    // Turmuhr: alle Zifferblätter hängen an einem Stromkreis → gleichzeitig
    prep.clocks.forEach(el => setD(el, on ? T.flood0 + .8 * T.sweep : OFF.flood0 + .2 * OFF.sweep));
    prep.crown.forEach(el => setD(el, on ? T.crown : OFF.crown));
    svg.getBoundingClientRect();  // Verzögerungen festschreiben, bevor die Klassen wechseln
    ['lamps', 'win', 'lit', 'crown'].forEach(c => svg.classList.toggle(c, on));
  }
  function say() { read.textContent = st.lit ? 'Abendlicht · Laternen, Fenster, Fassade' : 'Nacht'; }
  function show(k) {
    st.k = 0;
    const next = view(st.k);
    clock(next);
    next.classList.add('out');
    stage.appendChild(next);
    requestAnimationFrame(() => requestAnimationFrame(() => next.classList.remove('out')));
    if (cur && cur !== next) { const old = cur; old.classList.add('out'); setTimeout(() => old.remove(), 460); }
    cur = next; say();
  }
  let demo = [];
  const setLit = v => { st.lit = v; bLight.setAttribute('aria-pressed', v); applyLight(cur); say(); };
  bLight.addEventListener('click', () => { demo.forEach(clearTimeout); demo = []; setLit(!st.lit); });
  setInterval(() => cur && clock(cur), 20000);
  const q = new URLSearchParams(location.search);
  show(0);
  // Beim ersten Aufruf: einmal von selbst angehen und wieder ausgehen, danach nur per Knopf. ?sofort = sofort an
  if (q.has('sofort')) { cur.classList.add('instant'); setLit(true); }
  else demo = [setTimeout(() => setLit(true), 900), setTimeout(() => setLit(false), 900 + 10400)];
})();
</script>
</body>
